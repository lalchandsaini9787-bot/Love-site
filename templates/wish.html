<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surprise for {{ data.name }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</head>
<body id="body" class="bg-black text-white font-[Poppins] min-h-screen flex justify-center items-center p-4 overflow-hidden">

{% if data.theme == 'bday' %}
<div class="absolute inset-0 bg-gradient-to-br from-purple-700 via-pink-600 to-orange-500"></div>
{% else %}
<div class="absolute inset-0 bg-gradient-to-br from-[#ff0040] via-[#8a0030] to-black"></div>
{% endif %}

<div class="relative w-full max-w-[420px] bg-white text-black rounded-[32px] p-8 text-center shadow-[0_20px_80px_rgba(0,0,0,0.5)]">
    <p class="text-sm tracking-[4px] opacity-40 font-bold">{{ 'BIRTHDAY SURPRISE' if data.theme == 'bday' else 'LOVE SURPRISE' }}</p>
    <h1 id="typewriter" class="font-['Dancing_Script'] text-[42px] font-bold mt-4 leading-none"></h1>
    <div class="w-12 h-[3px] bg-black/10 mx-auto my-5 rounded-full"></div>
    <p class="text-[16px] leading-[1.7] text-black/70 whitespace-pre-wrap">{{ data.message }}</p>

    <div class="mt-8 bg-black/5 p-4 rounded-2xl">
        <p class="text-[11px] tracking-widest opacity-50 font-bold">SCAN TO REPLAY</p>
        <img src="data:image/png;base64,{{ qr }}" class="w-32 h-32 mx-auto mt-3 rounded-xl">
        <p class="text-[10px] mt-2 opacity-40 break-all">{{ link }}</p>
    </div>
</div>

<script>
    const name = "{{ data.name }}";
    const theme = "{{ data.theme }}";
    const text = theme === 'bday'? `Happy Birthday ${name}! 🎂` : `Hey ${name}, I Love You ❤️`;
    let i=0;
    function type(){
        if(i<text.length){ document.getElementById('typewriter').innerHTML += text.charAt(i); i++; setTimeout(type, 80); }
    }
    type();

    // Premium Effects
    if(theme === 'bday'){
        setInterval(()=>{ confetti({particleCount: 100, spread: 70, origin: {y: 0.6}}) }, 1500);
    } else {
        setInterval(()=>{
            const heart = document.createElement('div');
            heart.innerHTML = '❤️'; heart.style.position='absolute'; heart.style.left=Math.random()*100+'vw';
            heart.style.top='100vh'; heart.style.fontSize='20px'; heart.style.animation='float 4s linear';
            document.body.appendChild(heart);
            setTimeout(()=>heart.remove(),4000);
        }, 300);
    }
</script>
<style>@keyframes float{ to{ transform: translateY(-110vh) rotate(360deg); } }</style>
</body>
</html>
